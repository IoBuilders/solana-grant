# Generated by src/cmd/genasyncapi from the Go event structs — do not edit by hand.
# Run 'make eventSpecs' after changing an event, and commit the result.

asyncapi: 3.0.0
info:
  title: DLT Ingress Events
  version: 1.0.0
  description: |-
    Domain events published by the dltingress bounded context, which owns custody key management,
    the transaction dispatch pipeline (build → sign → send → retry) and the faucet wallets that keep
    the custody accounts funded.

    MODELLING NOTES

    The transport is a Postgres outbox (event_stores) drained by an in-process relay, not a message
    broker. The servers section is therefore descriptive only, and there are no protocol bindings.
    The contract lives in components.messages and components.schemas.

    Channels, producers, consumers and x-orphan are read from the code: a channel address is built
    from the package that declares the struct, producers from the bus.Publish call sites, consumers
    from the listeners registered for the event. An event with no registered consumer anywhere is
    marked x-orphan — a finding, not an error: under event sourcing an event with no consumer is
    still history.

    Structs that embed event.BaseEvent but are never published are excluded as command response DTOs
    rather than listed as messages; the generator requires each one to be declared with its reason,
    so a genuinely new event cannot pass as one of them.

    AsyncAPI has no native concept of an aggregate stream, so event-sourcing metadata is carried in
    the custom x-aggregate extension. Whether each aggregate can actually be rebuilt from these
    events is NOT expressible here — that analysis lives in docs/events/dltingress-event-sourcing.md.

    Payload schemas are reflected from the Go structs, so a field is described here only if its
    struct tag describes it. Fields this repository declares carry camelCase json tags; Id and
    CreatedAt come from event.BaseEvent in iob-go-core, which has no tags, so they stay PascalCase on
    the wire. Amounts are amount.Amount values, serialised as decimal strings that preserve arbitrary
    precision and an explicit decimals count; the ones inside the embedded EVM/SVM transaction payload
    models reflect as string|null, whether or not the Go field is itself a pointer, while amount fields
    declared directly on an event — the faucet wallet ones — reflect as plain strings.
defaultContentType: application/json
servers:
  internal-cross-outbox:
    host: dlt-ingress
    protocol: in-process
    description: Cross-context bus. Same outbox table with is_cross = true, used for events crossing bounded context boundaries.
  internal-outbox:
    host: dlt-ingress
    protocol: in-process
    description: Events are persisted to the event_stores table by OutboxBus within the command's transaction, then dispatched in-process by the memory relay to registered listeners.
channels:
  created:
    address: dltingress.faucetwallet.Created
    messages:
      Created:
        $ref: '#/components/messages/Created'
    servers:
      - $ref: '#/servers/internal-outbox'
  keyCreated:
    address: dltingress.custodykey.KeyCreated
    messages:
      KeyCreated:
        $ref: '#/components/messages/KeyCreated'
    servers:
      - $ref: '#/servers/internal-outbox'
  keyCreatedCross:
    address: dltingress.custodykey.KeyCreatedCross
    messages:
      KeyCreatedCross:
        $ref: '#/components/messages/KeyCreatedCross'
    servers:
      - $ref: '#/servers/internal-cross-outbox'
  retried:
    address: dltingress.transaction.Retried
    messages:
      Retried:
        $ref: '#/components/messages/Retried'
    servers:
      - $ref: '#/servers/internal-outbox'
  saved:
    address: dltingress.failedtransaction.Saved
    messages:
      Saved:
        $ref: '#/components/messages/Saved'
    servers:
      - $ref: '#/servers/internal-outbox'
  transactionSent:
    address: dltingress.transaction.TransactionSent
    messages:
      TransactionSent:
        $ref: '#/components/messages/TransactionSent'
    servers:
      - $ref: '#/servers/internal-outbox'
  transitFailedTransactionToRetried:
    address: dltingress.failedtransaction.TransitFailedTransactionToRetried
    messages:
      TransitFailedTransactionToRetried:
        $ref: '#/components/messages/TransitFailedTransactionToRetried'
    servers:
      - $ref: '#/servers/internal-outbox'
  updated:
    address: dltingress.faucetwallet.Updated
    messages:
      Updated:
        $ref: '#/components/messages/Updated'
    servers:
      - $ref: '#/servers/internal-outbox'
operations:
  receiveKeyCreated:
    action: receive
    channel:
      $ref: '#/channels/keyCreated'
    summary: Consumed by fundaccountlistener.Listener and keycreatedlistener.Listener. That listener republishes it on the cross bus.
  receiveRetried:
    action: receive
    channel:
      $ref: '#/channels/retried'
    summary: Consumed by transitfailedtransactiontoretriedlistener.Listener.
  sendCreated:
    action: send
    channel:
      $ref: '#/channels/created'
    summary: Published by the createfaucetwallet command handler. No bounded context currently consumes it.
  sendKeyCreated:
    action: send
    channel:
      $ref: '#/channels/keyCreated'
    summary: Published by the createkey command handler. The custody provider has already returned the key at that point.
  sendKeyCreatedCross:
    action: send
    channel:
      $ref: '#/channels/keyCreatedCross'
    summary: Published by the keycreated listener. No bounded context currently consumes it.
  sendRetried:
    action: send
    channel:
      $ref: '#/channels/retried'
    summary: Published by the retrytransaction command handler.
  sendSaved:
    action: send
    channel:
      $ref: '#/channels/saved'
    summary: Published by the savefailedtransaction command handler. No bounded context currently consumes it.
  sendTransactionSent:
    action: send
    channel:
      $ref: '#/channels/transactionSent'
    summary: Published by the signandsend command handler. No bounded context currently consumes it. The transaction has already been submitted to the node at that point.
  sendTransitFailedTransactionToRetried:
    action: send
    channel:
      $ref: '#/channels/transitFailedTransactionToRetried'
    summary: Published by the transitfailedtransactiontoretried command handler. No bounded context currently consumes it.
  sendUpdated:
    action: send
    channel:
      $ref: '#/channels/updated'
    summary: Published by the updatefaucetwallet command handler. No bounded context currently consumes it.
components:
  schemas:
    BaseEvent:
      type: object
      required:
        - Id
        - CreatedAt
      properties:
        Id:
          type: string
          format: uuid
          description: Event identity. NOT the aggregate identity. Untagged upstream, hence PascalCase.
        CreatedAt:
          type: string
          format: date-time
          description: When the event was recorded. Untagged upstream, hence PascalCase.
    CreatedEvent:
      required:
        - faucetWalletId
        - networkId
        - custodyKeyId
        - dltAccountId
        - fundingAmount
        - balanceThreshold
        - enabled
      properties:
        balanceThreshold:
          description: Balance below which a top-up is triggered, in the network's smallest native unit. Always lower than fundingAmount.
          type: string
        custodyKeyId:
          $ref: '#/components/schemas/UUID'
          description: The custody key provisioned for this wallet.
        dltAccountId:
          description: Address of the account that funds the top-ups.
          type: string
        enabled:
          description: Whether top-ups are performed for this network. Always true on creation.
          type: boolean
        faucetWalletId:
          $ref: '#/components/schemas/UUID'
          description: Identity of the faucet wallet.
        fundingAmount:
          description: Amount transferred on each top-up, in the network's smallest native unit (e.g. wei for EVM networks).
          type: string
        networkId:
          description: Network the wallet funds accounts on. One faucet wallet per network.
          maxLength: 255
          type: string
      type: object
    KeyCreatedCrossEvent:
      required:
        - dltAccountId
        - externalId
        - dlt
        - custodyProvider
      properties:
        custodyProvider:
          description: Service holding the private key.
          enum:
            - DFNS
            - KMS
          type: string
        dlt:
          description: 'Widened from common.Dlt - replay must re-parse via ParseDlt.'
          enum:
            - EVM
            - SVM
            - Hashgraph
          type: string
        dltAccountId:
          description: Blockchain address the key signs for, and the natural key of the custody key.
          type: string
        externalId:
          description: Identifier of the key at the custody provider.
          type: string
      type: object
    KeyCreatedEvent:
      required:
        - dltAccountId
        - externalId
        - dlt
        - custodyProvider
      properties:
        custodyProvider:
          description: Service holding the private key.
          enum:
            - DFNS
            - KMS
          type: string
        dlt:
          description: 'Widened from common.Dlt - replay must re-parse via ParseDlt.'
          enum:
            - EVM
            - SVM
            - Hashgraph
          type: string
        dltAccountId:
          description: Blockchain address the key signs for, and the natural key of the custody key.
          type: string
        externalId:
          description: Identifier of the key at the custody provider.
          type: string
      type: object
    RetriedEvent:
      required:
        - oldTxId
        - newTxId
      properties:
        newTxId:
          description: The replacement transaction.
          type: string
        oldTxId:
          description: The superseded transaction.
          type: string
      type: object
    SavedEvent:
      required:
        - txId
        - networkId
        - errorDetails
      properties:
        errorDetails:
          description: Failure reason as reported by the blockchain context.
          maxLength: 5000
          type: string
        networkId:
          description: Network the transaction was submitted to.
          type: string
        txId:
          description: Identifier of the transaction that failed.
          type: string
      type: object
    TransactionSentEvent:
      required:
        - txId
        - networkId
        - dlt
      properties:
        cuLimit:
          description: SVM variant.
          type:
            - string
            - 'null'
        cuPrice:
          description: SVM variant.
          type:
            - string
            - 'null'
        data:
          description: EVM variant. ABI-encoded call data.
          type: string
        dlt:
          description: Discriminates which of the two field sets is present.
          enum:
            - EVM
            - SVM
          type: string
        feePayer:
          description: SVM variant.
          type: string
        fromAddress:
          description: EVM variant.
          type: string
        gasLimit:
          description: EVM variant.
          type:
            - string
            - 'null'
        gasPrice:
          description: EVM variant.
          type:
            - string
            - 'null'
        maxFeePerGas:
          description: EVM variant.
          type:
            - string
            - 'null'
        maxPriorityFeePerGas:
          description: EVM variant.
          type:
            - string
            - 'null'
        networkId:
          description: Network the transaction was submitted to.
          type: string
        nonce:
          description: EVM variant.
          type:
            - string
            - 'null'
        recentBlockhash:
          description: SVM variant.
          type: string
        serializedTransaction:
          description: SVM variant.
          type: string
        toAddress:
          description: EVM variant.
          type: string
        transactionType:
          description: EVM variant. 0 = legacy, 2 = EIP-1559.
          minimum: 0
          enum:
            - 0
            - 2
          type: integer
        txId:
          description: Deterministic transaction identifier, known before the transaction is submitted.
          type: string
        value:
          description: EVM variant.
          type:
            - string
            - 'null'
      type: object
    TransitFailedTransactionToRetriedEvent:
      required:
        - txId
        - networkId
      properties:
        networkId:
          description: Network the transaction was submitted to.
          type: string
        txId:
          description: Identifier of the failed transaction that the retry superseded.
          type: string
      type: object
    UUID:
      examples:
        - 248df4b7-aa70-47b8-a036-33ac447e668d
      type: string
      format: uuid
    UpdatedEvent:
      required:
        - faucetWalletId
        - networkId
        - fundingAmount
        - balanceThreshold
        - enabled
      properties:
        balanceThreshold:
          description: Balance below which a top-up is triggered, in the network's smallest native unit. Always lower than fundingAmount.
          type: string
        enabled:
          description: Whether top-ups are performed for this network.
          type: boolean
        faucetWalletId:
          $ref: '#/components/schemas/UUID'
          description: Identity of the faucet wallet.
        fundingAmount:
          description: Amount transferred on each top-up, in the network's smallest native unit (e.g. wei for EVM networks).
          type: string
        networkId:
          description: Network the wallet funds accounts on. One faucet wallet per network.
          maxLength: 255
          type: string
      type: object
  messages:
    Created:
      name: Created
      title: Faucet wallet created
      summary: 'A faucet wallet was configured for a network: a custody key was provisioned for it and bound to the funding amount and the balance threshold that trigger a top-up. Created enabled.'
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/CreatedEvent'
      x-go-type: faucetwallet.CreatedEvent
      x-orphan: true
      x-aggregate:
        type: FaucetWallet
        idField: faucetWalletId
        note: Both the custody key and the wallet row are already persisted when this is published. networkId is a second unique key — there is at most one wallet per network, and that is how the handlers look it up.
    KeyCreated:
      name: KeyCreated
      title: Custody key created
      summary: A signing key was created at the custody provider and registered locally, binding a dltAccountId to the provider's own externalId.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/KeyCreatedEvent'
      x-go-type: custodykey.KeyCreatedEvent
      x-aggregate:
        type: CustodyKey
        idField: dltAccountId
        note: Natural key. The aggregate Id uuid is not carried — see gap B1.
    KeyCreatedCross:
      name: KeyCreatedCross
      title: Custody key created (cross-context)
      summary: Field-for-field copy of KeyCreated republished on the cross bus.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/KeyCreatedCrossEvent'
      x-go-type: custodykeyevents.KeyCreatedCrossEvent
      x-orphan: true
      x-aggregate:
        type: CustodyKey
        idField: dltAccountId
    Retried:
      name: Retried
      title: Transaction retried
      summary: A stuck transaction was re-signed and resubmitted with higher gas, producing a replacement transaction. Carries only the two identifiers — see gap B4.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/RetriedEvent'
      x-go-type: transaction.RetriedEvent
      x-aggregate:
        type: EvmTransaction
        idField: newTxId
    Saved:
      name: Saved
      title: Failed transaction recorded
      summary: A transaction was reported as failed by the blockchain context and recorded for later retry. Implies status NOT_RETRIED.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/SavedEvent'
      x-go-type: failedtransaction.SavedEvent
      x-orphan: true
      x-aggregate:
        type: FailedTransaction
        idField: txId
    TransactionSent:
      name: TransactionSent
      title: Transaction signed and submitted
      summary: A transaction was signed by the custody provider and submitted to the node. The transaction id is deterministic and known before sending, so the row is persisted beforehand.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/TransactionSentEvent'
      x-go-type: transaction.TransactionSentEvent
      x-orphan: true
      x-aggregate:
        type: EvmTransaction | SvmTransaction
        idField: txId
        note: Variant selected by the dlt field. The two payload models are embedded pointers in Go and flatten into this object on marshal — see gap B6.
    TransitFailedTransactionToRetried:
      name: TransitFailedTransactionToRetried
      title: Failed transaction moved to retried
      summary: The failed transaction was superseded by a retry. Implies status RETRIED. Name is imperative where the convention requires past tense — see gap H3.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/TransitFailedTransactionToRetriedEvent'
      x-go-type: failedtransaction.TransitFailedTransactionToRetriedEvent
      x-orphan: true
      x-aggregate:
        type: FailedTransaction
        idField: txId
    Updated:
      name: Updated
      title: Faucet wallet updated
      summary: The funding amount, the balance threshold or the enabled flag of a network's faucet wallet was changed. Carries the resulting configuration in full, not a delta.
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/BaseEvent'
          - $ref: '#/components/schemas/UpdatedEvent'
      x-go-type: faucetwallet.UpdatedEvent
      x-orphan: true
      x-aggregate:
        type: FaucetWallet
        idField: faucetWalletId
        note: The custody key binding cannot change, so it is not carried here.
